[package]
name = "annulus"
version = "0.2.1"
edition = "2021"
rust-version = "1.97.0"
description = "Reference implementation of the Annulus programming language"
license = "Unlicense"
publish = false

[lib]
name = "annulus"
path = "src/lib.rs"

[[bin]]
name = "annulus"
path = "src/main.rs"

[dependencies]
virga = { git = "https://github.com/KeychainofSolomon/72Virga", rev = "48ee869b0f4cf741f8e4e8151fd9c8d844bc016e" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false

[features]
probatio = []

[dev-dependencies]
annulus = { path = ".", features = ["probatio"] }
