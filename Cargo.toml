[package]
name = "annulus"
version = "0.2.1"
edition = "2021"
rust-version = "1.97.0"
description = "Reference implementation of the Annulus programming language"
license = "Unlicense"
publish = false

[lib]
name = "annulus"
path = "src/lib.rs"

[[bin]]
name = "annulus"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
